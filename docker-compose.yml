name: light
services:
  light:
    image: ${LIGHT_IMAGE:-ghcr.io/a1zaza/light:latest}
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - ./data:/var/lib/light
    environment:
      TZ: Asia/Shanghai
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 75s
    restart: unless-stopped
