name: light
services:
  light:
    image: light:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - ./data:/var/lib/light
    environment:
      TZ: Asia/Shanghai
      LIGHT_RATE_LIMIT_IP_HEADER: ${LIGHT_RATE_LIMIT_IP_HEADER:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 75s
    restart: unless-stopped
